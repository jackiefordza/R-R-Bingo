<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Bingo Card Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background */
        }

        /* General grid styling */
        .bingo-grid th, .bingo-grid td {
            border: 1px solid #d1d5db; /* Gray border */
            text-align: center;
            vertical-align: middle;
            height: 75px; /* Slightly smaller height for potentially more cards */
            width: 20%; /* Equal width for 5 columns */
            overflow: hidden; /* Hide overflow */
            font-size: 0.75rem; /* Smaller font size for content */
            padding: 4px; /* Padding within cells */
            word-break: break-word; /* Break long words */
        }
         .bingo-grid th {
            background-color: #e5e7eb; /* Light gray header */
            font-weight: bold;
            font-size: 1rem;
            height: 40px; /* Specific height for header */
         }

        /* Styling for each card instance */
        .bingo-card-instance {
            margin-bottom: 2rem; /* Space between cards on screen */
            border: 1px solid #ccc; /* Border around each card */
            padding: 1rem; /* Padding inside card wrapper */
            background-color: white; /* White background for card */
            border-radius: 0.5rem; /* Rounded corners */
        }
         .bingo-card-instance h4 {
             text-align: center;
             font-size: 1.2rem; /* Slightly larger title */
             font-weight: 600;
             margin-bottom: 0.8rem;
             color: #374151; /* Darker gray text */
         }

        /* Styles for printing */
        @media print {
            body {
                background-color: white; /* Ensure white background for printing */
            }
            body * {
                visibility: hidden; /* Hide everything by default */
            }
            #bingo-cards-output, #bingo-cards-output * {
                visibility: visible; /* Show only the bingo card container and its contents */
            }
            #bingo-cards-output {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
                margin: 0;
                padding: 0;
            }
             .bingo-card-instance {
                 visibility: visible; /* Ensure card instance is visible */
                 page-break-after: always; /* Page break after each card */
                 margin-bottom: 0; /* Remove screen margin */
                 border: none; /* Remove screen border */
                 padding: 0.5in; /* Add some padding for printing */
                 box-shadow: none; /* Remove shadow */
                 border-radius: 0;
             }
             .bingo-card-instance:last-child {
                 page-break-after: auto; /* No page break after the last card */
             }
             .bingo-card-instance h4 {
                 margin-top: 0; /* Adjust title margin for print */
                 font-size: 14pt; /* Adjust title font size for print */
             }
             .bingo-grid {
                 /* Ensure grid lines are visible when printing */
                border-collapse: collapse;
                 width: 100%; /* Ensure table takes full width within padding */
            }
             .bingo-grid th, .bingo-grid td {
                border: 1px solid black !important; /* Add black borders for printing */
                padding: 6px; /* Adjust padding as needed */
                font-size: 9pt; /* Adjust font size for printing */
                height: auto; /* Let height adjust for print */
                visibility: visible; /* Ensure cells are visible */
            }
            .bingo-grid th {
                background-color: #e5e7eb !important; /* Light gray header */
                 -webkit-print-color-adjust: exact; /* Ensure background color prints in Chrome/Safari */
                 color-adjust: exact; /* Ensure background color prints */
            }
             /* Hide non-essential elements during print */
             #main-container > *:not(#bingo-cards-output) {
                 display: none !important;
             }
        }

        /* Style for the song list */
        #song-list li {
            padding: 2px 0;
        }
    </style>
</head>
<body class="p-6 md:p-10">

    <div id="main-container" class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-lg shadow-md">

        <h1 class="text-2xl md:text-3xl font-bold mb-6 text-center text-gray-800">Music Bingo Card Generator</h1>

        <div id="input-section" class="mb-6 p-4 border border-gray-200 rounded-lg bg-gray-50">
            <h2 class="text-xl font-semibold mb-4 text-gray-700">1. Add Songs</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 pb-4 border-b border-gray-200">
                <div>
                    <label for="song-title" class="block text-sm font-medium text-gray-600 mb-1">Song Title:</label>
                    <input type="text" id="song-title" placeholder="e.g., Sweet Home Alabama" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="song-artist" class="block text-sm font-medium text-gray-600 mb-1">Artist:</label>
                    <input type="text" id="song-artist" placeholder="e.g., Lynyrd Skynyrd" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex items-end">
                    <button id="add-song-btn" class="w-full md:w-auto bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition duration-150 ease-in-out">
                        Add Song
                    </button>
                </div>
            </div>
             <p id="input-error" class="text-red-500 text-sm mt-2 mb-4 hidden"></p>

             <div class="mt-4">
                 <h3 class="text-lg font-semibold mb-2 text-gray-700">Or Add Multiple Songs</h3>
                 <label for="bulk-songs-input" class="block text-sm font-medium text-gray-600 mb-1">
                     Enter one song per line using the format: <code class="bg-gray-200 px-1 rounded">Song Title - Artist</code>
                 </label>
                <textarea id="bulk-songs-input" rows="5" placeholder="Sweet Home Alabama - Lynyrd Skynyrd&#10;Bohemian Rhapsody - Queen&#10;Hotel California - Eagles" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 mb-2"></textarea>
                <button id="add-bulk-btn" class="bg-purple-600 hover:bg-purple-700 text-white font-semibold py-2 px-4 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 transition duration-150 ease-in-out">
                    Add Songs from List
                </button>
                 <p id="bulk-status" class="text-sm text-gray-600 mt-2"></p>
            </div>
        </div>

        <div id="song-list-section" class="mb-6">
            <h3 class="text-lg font-semibold mb-2 text-gray-700">2. Check Song List (<span id="song-count">0</span> / 25 minimum)</h3>
            <ul id="song-list" class="list-none list-inside max-h-60 overflow-y-auto border border-gray-200 rounded-md p-3 bg-white text-sm text-gray-600">
                <div id="no-songs-message">No songs added yet.</div>
            </ul>
             <p id="list-error" class="text-red-500 text-sm mt-2 hidden">You need at least 25 songs to generate cards.</p>
        </div>

        <div id="action-buttons" class="mb-6 p-4 border border-gray-200 rounded-lg bg-gray-50">
             <h2 class="text-xl font-semibold mb-4 text-gray-700">3. Generate & Print Cards</h2>
             <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                 <div>
                     <label for="custom-title-input" class="block text-sm font-medium text-gray-600 mb-1">Card Title (Optional):</label>
                     <input type="text" id="custom-title-input" placeholder="Music Bingo" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                 </div>
                 <div>
                     <label for="card-count-input" class="block text-sm font-medium text-gray-600 mb-1">Number of Cards:</label>
                     <input type="number" id="card-count-input" value="1" min="1" class="w-full md:w-24 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                 </div>
             </div>
             <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-4">
                 <button id="generate-cards-btn" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Generate Bingo Cards
                </button>
                <button id="print-cards-btn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out hidden">
                    Print Cards
                </button>
                 <button id="reset-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition duration-150 ease-in-out">
                    Reset All
                </button>
            </div>
             <p id="generate-error" class="text-red-500 text-sm mt-2 text-center hidden"></p>
        </div>


        <div id="bingo-cards-output" class="mt-8">
             <div id="bingo-placeholder" class="p-10 text-center text-gray-500 bg-white border border-gray-200 rounded-lg">
                 Your bingo cards will appear here once generated.
             </div>
             </div>

    </div> <script>
        // --- DOM Elements ---
        const songTitleInput = document.getElementById('song-title');
        const songArtistInput = document.getElementById('song-artist');
        const addSongBtn = document.getElementById('add-song-btn');
        const songListUl = document.getElementById('song-list');
        const songCountSpan = document.getElementById('song-count');
        const generateCardsBtn = document.getElementById('generate-cards-btn');
        const printCardsBtn = document.getElementById('print-cards-btn');
        const resetBtn = document.getElementById('reset-btn');
        const bingoCardsOutput = document.getElementById('bingo-cards-output');
        const bingoPlaceholder = document.getElementById('bingo-placeholder');
        const inputError = document.getElementById('input-error');
        const listError = document.getElementById('list-error');
        const generateError = document.getElementById('generate-error');
        const noSongsMessage = document.getElementById('no-songs-message');
        const bulkSongsInput = document.getElementById('bulk-songs-input');
        const addBulkBtn = document.getElementById('add-bulk-btn');
        const bulkStatus = document.getElementById('bulk-status');
        const cardCountInput = document.getElementById('card-count-input');
        const customTitleInput = document.getElementById('custom-title-input'); // New input for custom title


        // --- State ---
        let songs = []; // Array to hold song objects { title: '...', artist: '...' }
        const REQUIRED_SONGS = 25;
        const BULK_SEPARATOR = ' - ';
        const DEFAULT_CARD_TITLE = 'Music Bingo'; // Default title if input is empty

        // --- Functions ---

        function showInputError(message) {
            inputError.textContent = message;
            inputError.classList.remove('hidden');
        }
        function hideInputError() {
            inputError.classList.add('hidden');
            inputError.textContent = '';
        }
        function showListError(message) {
            listError.textContent = message;
            listError.classList.remove('hidden');
        }
        function hideListError() {
            listError.classList.add('hidden');
            listError.textContent = '';
        }
         function showGenerateError(message) {
            generateError.textContent = message;
            generateError.classList.remove('hidden');
        }
        function hideGenerateError() {
            generateError.classList.add('hidden');
            generateError.textContent = '';
        }
        function clearBulkStatus() {
            bulkStatus.textContent = '';
            bulkStatus.classList.remove('text-red-500', 'text-green-600');
        }

        function songExists(title, artist) {
             const lowerTitle = title.toLowerCase();
             const lowerArtist = artist.toLowerCase();
             return songs.some(song =>
                 song.title.toLowerCase() === lowerTitle &&
                 song.artist.toLowerCase() === lowerArtist
             );
        }

        function displaySongList() {
            songListUl.innerHTML = '';
            const noSongsDiv = document.getElementById('no-songs-message');
            if (songs.length === 0) {
                if (!noSongsDiv) {
                     const newNoSongsDiv = document.createElement('div');
                     newNoSongsDiv.id = 'no-songs-message';
                     newNoSongsDiv.textContent = 'No songs added yet.';
                     songListUl.appendChild(newNoSongsDiv);
                } else {
                     noSongsDiv.classList.remove('hidden');
                }
            } else {
                 if (noSongsDiv) noSongsDiv.classList.add('hidden');

                 songs.forEach((song, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${index + 1}. ${song.title} - ${song.artist}`;
                    li.classList.add('border-b', 'border-gray-100', 'last:border-b-0', 'py-1');
                    songListUl.appendChild(li);
                });
            }
            songCountSpan.textContent = songs.length;

            document.querySelector('#song-list-section h3').innerHTML = `2. Check Song List (<span id="song-count">${songs.length}</span> / ${REQUIRED_SONGS} minimum)`;

            if (songs.length >= REQUIRED_SONGS) {
                generateCardsBtn.disabled = false;
                hideListError();
            } else {
                generateCardsBtn.disabled = true;
                 if (songs.length > 0) {
                     showListError(`You need at least ${REQUIRED_SONGS} songs to generate cards.`);
                 } else {
                     hideListError();
                 }
            }
        }

        function addSong() {
            const title = songTitleInput.value.trim();
            const artist = songArtistInput.value.trim();
             hideInputError();
             clearBulkStatus();
             hideGenerateError();

            if (!title || !artist) {
                showInputError('Please enter both song title and artist.');
                return;
            }
            if (songExists(title, artist)) {
                 showInputError(`"${title} - ${artist}" is already in the list.`);
                 return;
            }
            songs.push({ title, artist });
            displaySongList();
            songTitleInput.value = '';
            songArtistInput.value = '';
            songTitleInput.focus();
        }

        function addBulkSongs() {
            const bulkText = bulkSongsInput.value.trim();
            const lines = bulkText.split('\n');
            let addedCount = 0;
            let errorCount = 0;
            let duplicateCount = 0;
            hideInputError();
            clearBulkStatus();
            hideGenerateError();

            if (!bulkText) {
                bulkStatus.textContent = 'Text area is empty.';
                bulkStatus.classList.add('text-red-500');
                return;
            }

            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return;
                const separatorIndex = trimmedLine.lastIndexOf(BULK_SEPARATOR);
                if (separatorIndex === -1) {
                    console.warn(`Skipping line (missing separator "${BULK_SEPARATOR}"): ${trimmedLine}`);
                    errorCount++;
                    return;
                }
                const title = trimmedLine.substring(0, separatorIndex).trim();
                const artist = trimmedLine.substring(separatorIndex + BULK_SEPARATOR.length).trim();
                if (!title || !artist) {
                     console.warn(`Skipping line (empty title or artist): ${trimmedLine}`);
                    errorCount++;
                    return;
                }
                if (songExists(title, artist)) {
                    duplicateCount++;
                } else {
                    songs.push({ title, artist });
                    addedCount++;
                }
            });

            if (addedCount > 0) {
                displaySongList();
            }

            let statusMessage = `Processed list: Added ${addedCount} songs.`;
            if (duplicateCount > 0) statusMessage += ` Skipped ${duplicateCount} duplicates.`;
            if (errorCount > 0) statusMessage += ` Encountered ${errorCount} formatting errors (check console).`;
            bulkStatus.textContent = statusMessage;
            if (errorCount > 0) bulkStatus.classList.add('text-red-500');
            else if (addedCount > 0) bulkStatus.classList.add('text-green-600');
            bulkSongsInput.value = '';
        }

        function shuffleArray(array) {
            // Fisher-Yates shuffle algorithm
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        /**
         * Generates and displays the requested number of bingo cards with a custom title.
         */
        function generateCards() {
            hideListError();
            hideGenerateError();
            clearBulkStatus();

            // --- Validate Inputs ---
            if (songs.length < REQUIRED_SONGS) {
                 showGenerateError(`You need at least ${REQUIRED_SONGS} songs to generate cards.`);
                return;
            }
            const numCards = parseInt(cardCountInput.value, 10);
            if (isNaN(numCards) || numCards < 1) {
                 showGenerateError("Please enter a valid number of cards (1 or more).");
                 cardCountInput.value = '1';
                 return;
            }
            // Get the custom title, use default if empty
            const customTitle = customTitleInput.value.trim() || DEFAULT_CARD_TITLE;


            // --- Clear Previous Output ---
            bingoCardsOutput.innerHTML = '';
            bingoPlaceholder.classList.add('hidden');

            // --- Generate Each Card ---
            for (let cardNum = 1; cardNum <= numCards; cardNum++) {
                // 1. Shuffle songs for each card
                const shuffledSongs = [...songs];
                shuffleArray(shuffledSongs);

                // 2. Select songs for this card
                const cardSongs = shuffledSongs.slice(0, REQUIRED_SONGS);
                 if (cardSongs.length < REQUIRED_SONGS) {
                     console.error(`Error generating card ${cardNum}: Not enough unique songs selected.`);
                     showGenerateError(`Error generating card ${cardNum}. Check song list.`);
                     continue;
                 }

                // 3. Create HTML structure
                const cardInstanceDiv = document.createElement('div');
                cardInstanceDiv.classList.add('bingo-card-instance');

                const cardTitleElement = document.createElement('h4');
                // Use the custom title here, without card number
                cardTitleElement.textContent = customTitle;
                cardInstanceDiv.appendChild(cardTitleElement);

                const table = document.createElement('table');
                table.classList.add('bingo-grid', 'w-full', 'border-collapse');
                const thead = table.createTHead();
                const tbody = table.createTBody();
                cardInstanceDiv.appendChild(table);

                // Create header row
                const headerRow = thead.insertRow();
                ['B', 'I', 'N', 'G', 'O'].forEach(letter => {
                    const th = document.createElement('th');
                    th.textContent = letter;
                    headerRow.appendChild(th);
                });

                // Create grid cells
                let songIndex = 0;
                for (let i = 0; i < 5; i++) {
                    const row = tbody.insertRow();
                    for (let j = 0; j < 5; j++) {
                        const cell = row.insertCell();
                        const song = cardSongs[songIndex++];
                        cell.innerHTML = `<span class="font-medium">${song.title}</span><br><span class="text-xs text-gray-500">${song.artist}</span>`;
                    }
                }

                // 4. Append card to output
                bingoCardsOutput.appendChild(cardInstanceDiv);
            }

            // --- Update UI ---
            if (bingoCardsOutput.children.length > 0) {
                 printCardsBtn.classList.remove('hidden');
            } else {
                 bingoPlaceholder.classList.remove('hidden');
                 bingoCardsOutput.appendChild(bingoPlaceholder);
            }
            generateCardsBtn.disabled = true;
        }

        /**
         * Triggers the browser's print dialog.
         */
        function printCards() {
            window.print();
        }

        /**
         * Resets the application state.
         */
        function resetApp() {
            songs = [];
            songTitleInput.value = '';
            songArtistInput.value = '';
            bulkSongsInput.value = '';
            cardCountInput.value = '1';
            customTitleInput.value = ''; // Clear custom title input
            hideInputError();
            hideListError();
            hideGenerateError();
            clearBulkStatus();
            displaySongList();
            bingoCardsOutput.innerHTML = ''; // Clear generated cards
             // Ensure placeholder exists before trying to show it
             let placeholder = document.getElementById('bingo-placeholder');
             if (!placeholder) {
                 placeholder = document.createElement('div');
                 placeholder.id = 'bingo-placeholder';
                 placeholder.className = 'p-10 text-center text-gray-500 bg-white border border-gray-200 rounded-lg';
                 placeholder.textContent = 'Your bingo cards will appear here once generated.';
                 bingoCardsOutput.appendChild(placeholder);
             }
             placeholder.classList.remove('hidden');

            printCardsBtn.classList.add('hidden');
            generateCardsBtn.disabled = true;
            songTitleInput.focus();
        }


        // --- Event Listeners ---
        addSongBtn.addEventListener('click', addSong);
        songArtistInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') addSong(); });
        songTitleInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') songArtistInput.focus(); });
        addBulkBtn.addEventListener('click', addBulkSongs);
        generateCardsBtn.addEventListener('click', generateCards);
        printCardsBtn.addEventListener('click', printCards);
        resetBtn.addEventListener('click', resetApp);

        // --- Initial Setup ---
        displaySongList();
        songTitleInput.focus();
         // Ensure placeholder is present on initial load
         if (!document.getElementById('bingo-placeholder')) {
             const initialPlaceholder = document.createElement('div');
             initialPlaceholder.id = 'bingo-placeholder';
             initialPlaceholder.className = 'p-10 text-center text-gray-500 bg-white border border-gray-200 rounded-lg';
             initialPlaceholder.textContent = 'Your bingo cards will appear here once generated.';
             bingoCardsOutput.appendChild(initialPlaceholder);
         }

    </script>

</body>
</html>
