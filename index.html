<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Bingo Card Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Custom styles */
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f1f5f9; /* slate-100 */
        }

        /* General grid styling (Screen) */
        .bingo-grid th, .bingo-grid td {
            border: 1px solid #d1d5db;
            text-align: center;
            vertical-align: middle;
            height: 75px;
            width: 20%;
            overflow: hidden;
            font-size: 0.75rem;
            padding: 4px;
            word-break: break-word;
        }
         .bingo-grid th {
            background-color: #e0e7ff; /* indigo-100 */
            color: #3730a3; /* indigo-800 */
            font-weight: bold;
            font-size: 1rem;
            height: 40px;
         }

        /* Styling for each card instance on screen */
        .bingo-card-instance {
            margin-bottom: 2rem;
            border: 1px solid #ccc;
            padding: 1rem;
            background-color: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }
         .bingo-card-instance h4 {
             text-align: center;
             font-size: 1.2rem;
             font-weight: 600;
             margin-bottom: 0.5rem;
             color: #3730a3; /* indigo-800 */
         }
         .win-conditions {
            text-align: center;
            font-size: 0.7rem;
            color: #4b5563;
            margin-bottom: 0.8rem;
         }
         .win-conditions span {
             margin: 0 0.5rem;
         }
         .win-conditions input[type="checkbox"] {
             width: 0.8rem;
             height: 0.8rem;
             margin-right: 0.2rem;
             vertical-align: middle;
             color: #4f46e5;
             border-color: #a5b4fc;
             border-radius: 0.125rem;
         }
         .win-conditions input[type="checkbox"]:focus {
              box-shadow: none;
              outline: 2px solid transparent;
              outline-offset: 2px;
              --tw-ring-color: #6366f1;
              box-shadow: 0 0 0 2px #fff, 0 0 0 calc(2px + 2px) var(--tw-ring-color);
         }


        /* Styles for printing */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0.5in; /* *** REDUCED PAGE MARGINS *** */
            }
            body {
                background-color: white;
                -webkit-print-color-adjust: exact;
                color-adjust: exact;
            }
            body * {
                visibility: hidden;
            }
            #bingo-cards-output, #bingo-cards-output * {
                visibility: visible;
            }
            #bingo-cards-output {
                position: static;
                width: 100%;
                margin: 0;
                padding: 0;
            }
             .bingo-card-instance {
                 visibility: visible;
                 width: 100%; /* Use full available width within margins */
                 /* max-height: 12cm; Removed */
                 /* overflow: hidden; Removed */
                 margin-left: auto;
                 margin-right: auto;
                 margin-bottom: 1cm; /* Space between top/bottom card */
                 padding: 0.5cm; /* Internal padding */
                 border: 1px solid #666;
                 box-shadow: none;
                 border-radius: 0;
                 page-break-inside: avoid; /* Still try to keep card together */
                 box-sizing: border-box;
             }
              /* Add page break after every second card */
             .bingo-card-instance:nth-child(2n) {
                  page-break-after: always;
                  margin-bottom: 0; /* No margin below the second card */
             }
             /* Remove bottom margin for the very last card overall */
             .bingo-card-instance:last-child {
                  margin-bottom: 0;
             }
              /* If the last card is odd, ensure no page break after it */
             .bingo-card-instance:nth-child(odd):last-child {
                 page-break-after: auto;
             }

             /* Keep internal elements relatively small to help fit */
             .bingo-card-instance h4 {
                 margin-top: 0;
                 font-size: 10pt;
                 margin-bottom: 0.2cm;
                 color: black !important;
             }
             .win-conditions {
                 font-size: 7pt;
                 margin-bottom: 0.3cm;
                 color: black !important;
             }
             .win-conditions input[type="checkbox"] {
                 appearance: auto;
                 border: 1px solid #333 !important;
                 vertical-align: middle;
                 width: 7pt;
                 height: 7pt;
                 color: black !important;
             }

             .bingo-grid {
                border-collapse: collapse;
                 width: 100%;
            }
             /* Style for TD and TH cells in print */
             .bingo-grid th, .bingo-grid td {
                border: 1px solid black !important;
                padding: 2px 3px;
                font-size: 7pt;
                height: auto;
                visibility: visible;
                 word-wrap: break-word;
                 color: black !important;
                 vertical-align: middle;
            }
             /* Specific style for TH cells in print */
            .bingo-grid th {
                background-color: #e5e7eb !important;
                font-size: 8pt;
                padding: 3px;
                color: black !important;
            }
             /* Hide non-essential elements during print */
             #main-container > *:not(#bingo-cards-output) {
                 display: none !important;
             }
        }

        /* Style for the song list */
        #song-list li {
            padding: 2px 0;
        }
    </style>
</head>
<body class="p-6 md:p-10 bg-slate-100">

    <div id="main-container" class="max-w-4xl mx-auto bg-white p-6 md:p-8 rounded-lg shadow-lg">

        <h1 class="text-3xl md:text-4xl font-bold mb-8 text-center text-indigo-700">Music Bingo Card Generator</h1>

        <div id="input-section" class="mb-6 p-4 border border-indigo-200 rounded-lg bg-indigo-50">
            <h2 class="text-xl font-semibold mb-4 text-indigo-800">1. Add Songs</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 pb-4 border-b border-indigo-100">
                <div>
                    <label for="song-title" class="block text-sm font-medium text-gray-700 mb-1">Song Title:</label>
                    <input type="text" id="song-title" placeholder="e.g., Sweet Home Alabama" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="song-artist" class="block text-sm font-medium text-gray-700 mb-1">Artist:</label>
                    <input type="text" id="song-artist" placeholder="e.g., Lynyrd Skynyrd" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex items-end">
                    <button id="add-song-btn" class="w-full md:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition duration-150 ease-in-out">
                        Add Song
                    </button>
                </div>
            </div>
             <p id="input-error" class="text-red-600 text-sm mt-2 mb-4 hidden"></p>
             <div class="mt-4">
                 <h3 class="text-lg font-semibold mb-2 text-indigo-800">Or Add Multiple Songs</h3>
                 <label for="bulk-songs-input" class="block text-sm font-medium text-gray-700 mb-1">
                     Enter one song per line using the format: <code class="bg-gray-200 px-1 rounded">Song Title - Artist</code>
                 </label>
                <textarea id="bulk-songs-input" rows="5" placeholder="Sweet Home Alabama - Lynyrd Skynyrd&#10;Bohemian Rhapsody - Queen&#10;Hotel California - Eagles" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 mb-2"></textarea>
                <button id="add-bulk-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-semibold py-2 px-4 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-150 ease-in-out">
                    Add Songs from List
                </button>
                 <p id="bulk-status" class="text-sm text-gray-600 mt-2"></p>
            </div>
        </div>

        <div id="song-list-section" class="mb-6">
            <h3 class="text-lg font-semibold mb-2 text-gray-700">2. Check Song List (<span id="song-count">0</span> / 25 minimum)</h3>
            <ul id="song-list" class="list-none list-inside max-h-60 overflow-y-auto border border-gray-300 rounded-md p-3 bg-white text-sm text-gray-600">
                <div id="no-songs-message">No songs added yet.</div>
            </ul>
             <p id="list-error" class="text-red-600 text-sm mt-2 hidden"></p>
        </div>

        <div id="action-buttons" class="mb-6 p-4 border border-teal-200 rounded-lg bg-teal-50">
             <h2 class="text-xl font-semibold mb-4 text-teal-800">3. Generate & Print Cards</h2>
             <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                 <div>
                     <label for="custom-title-input" class="block text-sm font-medium text-gray-700 mb-1">Card Title (Optional):</label>
                     <input type="text" id="custom-title-input" placeholder="Music Bingo" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                 </div>
                 <div>
                     <label for="card-count-input" class="block text-sm font-medium text-gray-700 mb-1">Number of Cards:</label>
                     <input type="number" id="card-count-input" value="1" min="1" class="w-full md:w-24 px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                 </div>
             </div>
             <div class="flex flex-col sm:flex-row items-center justify-center gap-4 mt-4">
                 <button id="generate-cards-btn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-2 px-6 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500 transition duration-150 ease-in-out disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                    Generate Bingo Cards
                </button>
                 <button id="print-cards-btn" class="bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-6 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-teal-500 transition duration-150 ease-in-out hidden">
                    Print Cards
                </button>
                 <button id="reset-btn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-6 rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-gray-400 transition duration-150 ease-in-out">
                    Reset All
                </button>
            </div>
             <p id="generate-error" class="text-red-600 text-sm mt-2 text-center hidden"></p>
        </div>

        <div id="bingo-cards-output" class="mt-8">
             <div id="bingo-placeholder" class="p-10 text-center text-gray-500 bg-white border border-gray-200 rounded-lg">
                 Your bingo cards will appear here once generated.
             </div>
             </div>

    </div> <script>
        // --- DOM Elements ---
        const songTitleInput = document.getElementById('song-title');
        const songArtistInput = document.getElementById('song-artist');
        const addSongBtn = document.getElementById('add-song-btn');
        const songListUl = document.getElementById('song-list');
        const songCountSpan = document.getElementById('song-count');
        const generateCardsBtn = document.getElementById('generate-cards-btn');
        const printCardsBtn = document.getElementById('print-cards-btn');
        const resetBtn = document.getElementById('reset-btn');
        const bingoCardsOutput = document.getElementById('bingo-cards-output');
        let bingoPlaceholder = document.getElementById('bingo-placeholder'); // Use let as it might be removed/re-added
        const inputError = document.getElementById('input-error');
        const listError = document.getElementById('list-error');
        const generateError = document.getElementById('generate-error');
        const noSongsMessage = document.getElementById('no-songs-message');
        const bulkSongsInput = document.getElementById('bulk-songs-input');
        const addBulkBtn = document.getElementById('add-bulk-btn');
        const bulkStatus = document.getElementById('bulk-status');
        const cardCountInput = document.getElementById('card-count-input');
        const customTitleInput = document.getElementById('custom-title-input');

        // --- State ---
        let songs = [];
        const REQUIRED_SONGS = 25;
        const BULK_SEPARATOR = ' - ';
        const DEFAULT_CARD_TITLE = 'Music Bingo';

        // --- Utility Functions ---
        function showInputError(message) { inputError.textContent = message; inputError.classList.remove('hidden'); }
        function hideInputError() { inputError.classList.add('hidden'); inputError.textContent = ''; }
        function showListError(message) { listError.textContent = message; listError.classList.remove('hidden'); }
        function hideListError() { listError.classList.add('hidden'); listError.textContent = ''; }
        function showGenerateError(message) { generateError.textContent = message; generateError.classList.remove('hidden'); }
        function hideGenerateError() { generateError.classList.add('hidden'); generateError.textContent = ''; }
        function clearBulkStatus() { bulkStatus.textContent = ''; bulkStatus.classList.remove('text-red-500', 'text-green-600'); }

        function songExists(title, artist) {
             const lowerTitle = title.toLowerCase();
             const lowerArtist = artist.toLowerCase();
             return songs.some(song => song.title.toLowerCase() === lowerTitle && song.artist.toLowerCase() === lowerArtist);
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // --- Core Functions ---

        /**
         * Updates the displayed list of songs and checks generation readiness.
         */
        function displaySongList() {
            songListUl.innerHTML = ''; // Clear list first
            const noSongsDiv = document.getElementById('no-songs-message'); // Check if message exists

            if (songs.length === 0) {
                 // Ensure the 'no songs' message is present and visible
                 if (!noSongsDiv) {
                     const newNoSongsDiv = document.createElement('div');
                     newNoSongsDiv.id = 'no-songs-message';
                     newNoSongsDiv.textContent = 'No songs added yet.';
                     songListUl.appendChild(newNoSongsDiv);
                 } else {
                     noSongsDiv.classList.remove('hidden');
                 }
            } else {
                 // Hide 'no songs' message if it exists
                 if (noSongsDiv) noSongsDiv.classList.add('hidden');
                 // Add each song as a list item
                 songs.forEach((song, index) => {
                    const li = document.createElement('li');
                    li.textContent = `${index + 1}. ${song.title} - ${song.artist}`;
                    li.classList.add('border-b', 'border-gray-100', 'last:border-b-0', 'py-1');
                    songListUl.appendChild(li);
                });
            }
            // Update song count display
            songCountSpan.textContent = songs.length;
            document.querySelector('#song-list-section h3').innerHTML = `2. Check Song List (<span id="song-count">${songs.length}</span> / ${REQUIRED_SONGS} minimum)`;

            // Enable/disable generate button and show/hide list error message
            if (songs.length >= REQUIRED_SONGS) {
                generateCardsBtn.disabled = false;
                hideListError();
            } else {
                generateCardsBtn.disabled = true;
                 if (songs.length > 0) { // Show error only if some songs are added but not enough
                     showListError(`You need at least ${REQUIRED_SONGS} songs to generate cards.`);
                 } else { // Hide error if the list is simply empty
                     hideListError();
                 }
            }
        }

        /**
         * Adds a single song from the input fields.
         */
        function addSong() {
            const title = songTitleInput.value.trim();
            const artist = songArtistInput.value.trim();
             hideInputError(); clearBulkStatus(); hideGenerateError(); // Clear errors

            if (!title || !artist) { showInputError('Please enter both song title and artist.'); return; }
            if (songExists(title, artist)) { showInputError(`"${title} - ${artist}" is already in the list.`); return; }

            songs.push({ title, artist });
            displaySongList(); // Update UI
            songTitleInput.value = ''; songArtistInput.value = ''; // Clear inputs
            songTitleInput.focus(); // Focus back on title input
        }

        /**
         * Adds multiple songs from the bulk textarea.
         */
        function addBulkSongs() {
            const bulkText = bulkSongsInput.value.trim();
            const lines = bulkText.split('\n');
            let addedCount = 0, errorCount = 0, duplicateCount = 0;
            hideInputError(); clearBulkStatus(); hideGenerateError(); // Clear errors

            if (!bulkText) { bulkStatus.textContent = 'Text area is empty.'; bulkStatus.classList.add('text-red-500'); return; }

            lines.forEach(line => {
                const trimmedLine = line.trim();
                if (!trimmedLine) return; // Skip empty lines
                const separatorIndex = trimmedLine.lastIndexOf(BULK_SEPARATOR);
                if (separatorIndex === -1) { console.warn(`Skipping line (missing separator "${BULK_SEPARATOR}"): ${trimmedLine}`); errorCount++; return; }
                const title = trimmedLine.substring(0, separatorIndex).trim();
                const artist = trimmedLine.substring(separatorIndex + BULK_SEPARATOR.length).trim();
                if (!title || !artist) { console.warn(`Skipping line (empty title or artist): ${trimmedLine}`); errorCount++; return; }
                if (songExists(title, artist)) { duplicateCount++; }
                else { songs.push({ title, artist }); addedCount++; }
            });

            if (addedCount > 0) { displaySongList(); } // Update UI if songs were added

            // Display status message
            let statusMessage = `Processed list: Added ${addedCount} songs.`;
            if (duplicateCount > 0) statusMessage += ` Skipped ${duplicateCount} duplicates.`;
            if (errorCount > 0) statusMessage += ` Encountered ${errorCount} formatting errors (check console).`;
            bulkStatus.textContent = statusMessage;
            if (errorCount > 0) bulkStatus.classList.add('text-red-500');
            else if (addedCount > 0) bulkStatus.classList.add('text-green-600');
            bulkSongsInput.value = ''; // Clear textarea
        }


        /**
         * Generates and displays the requested number of bingo cards.
         */
        function generateCards() {
            hideListError(); hideGenerateError(); clearBulkStatus(); // Clear errors

            // --- Validate Inputs ---
            if (songs.length < REQUIRED_SONGS) { showGenerateError(`You need at least ${REQUIRED_SONGS} songs.`); return; }
            const numCards = parseInt(cardCountInput.value, 10);
            if (isNaN(numCards) || numCards < 1) { showGenerateError("Please enter a valid number of cards (1 or more)."); cardCountInput.value = '1'; return; }
            const customTitle = customTitleInput.value.trim() || DEFAULT_CARD_TITLE;

            // --- Clear Previous Output ---
            bingoCardsOutput.innerHTML = ''; // Clear placeholder and previous cards
            bingoPlaceholder = null; // Remove reference to old placeholder

            // --- Generate Each Card ---
            for (let cardNum = 1; cardNum <= numCards; cardNum++) {
                // 1. Shuffle songs
                const shuffledSongs = [...songs];
                shuffleArray(shuffledSongs);
                const cardSongs = shuffledSongs.slice(0, REQUIRED_SONGS);
                 if (cardSongs.length < REQUIRED_SONGS) { console.error(`Error generating card ${cardNum}: Not enough songs.`); showGenerateError(`Error generating card ${cardNum}.`); continue; }

                // 2. Create Card Structure (Div, Title, Win Conditions, Table)
                const cardInstanceDiv = document.createElement('div');
                cardInstanceDiv.classList.add('bingo-card-instance');

                // Card Title
                const cardTitleElement = document.createElement('h4');
                cardTitleElement.textContent = customTitle;
                cardInstanceDiv.appendChild(cardTitleElement);

                // Win Conditions Text & Checkboxes
                const winConditionsDiv = document.createElement('div');
                winConditionsDiv.classList.add('win-conditions'); // Add class for styling

                // -- Four Corners --
                const spanCorners = document.createElement('span');
                const cbCorners = document.createElement('input');
                cbCorners.type = 'checkbox';
                cbCorners.classList.add('win-checkbox'); // Class for potential styling
                spanCorners.appendChild(cbCorners);
                spanCorners.appendChild(document.createTextNode(' Four Corners'));
                winConditionsDiv.appendChild(spanCorners);

                 // -- A Line --
                const spanLine = document.createElement('span');
                const cbLine = document.createElement('input');
                cbLine.type = 'checkbox';
                cbLine.classList.add('win-checkbox');
                spanLine.appendChild(cbLine);
                spanLine.appendChild(document.createTextNode(' A Line'));
                winConditionsDiv.appendChild(spanLine);

                cardInstanceDiv.appendChild(winConditionsDiv); // Add win conditions below title

                // Bingo Grid Table
                const table = document.createElement('table');
                table.classList.add('bingo-grid', 'w-full', 'border-collapse');
                const thead = table.createTHead();
                const tbody = table.createTBody();
                cardInstanceDiv.appendChild(table);

                // Header Row (BINGO)
                const headerRow = thead.insertRow();
                ['B', 'I', 'N', 'G', 'O'].forEach(letter => { const th = document.createElement('th'); th.textContent = letter; headerRow.appendChild(th); });

                // Grid Cells (Songs)
                let songIndex = 0;
                for (let i = 0; i < 5; i++) {
                    const row = tbody.insertRow();
                    for (let j = 0; j < 5; j++) {
                        const cell = row.insertCell();
                        const song = cardSongs[songIndex++];
                        // Add title and artist, separated by line break
                        cell.innerHTML = `<span class="font-medium">${song.title}</span><br><span class="text-xs text-gray-500">${song.artist}</span>`;
                    }
                }

                // 3. Append the completed card to the output area
                bingoCardsOutput.appendChild(cardInstanceDiv);
            }

            // --- Update UI ---
            if (bingoCardsOutput.children.length > 0) {
                 printCardsBtn.classList.remove('hidden'); // Show print button if cards were generated
            } else {
                 // If somehow no cards were generated, re-add placeholder
                 ensurePlaceholderExists(true);
            }
            generateCardsBtn.disabled = true; // Disable generate button
        }

        /**
         * Triggers the browser's print dialog.
         */
        function printCards() {
            window.print();
        }

         /**
         * Ensures the placeholder div exists and is shown/hidden.
         * @param {boolean} show - If true, show the placeholder; otherwise, hide it.
         */
         function ensurePlaceholderExists(show = true) {
             bingoPlaceholder = document.getElementById('bingo-placeholder');
             if (!bingoPlaceholder) {
                 bingoPlaceholder = document.createElement('div');
                 bingoPlaceholder.id = 'bingo-placeholder';
                 bingoPlaceholder.className = 'p-10 text-center text-gray-500 bg-white border border-gray-200 rounded-lg';
                 bingoPlaceholder.textContent = 'Your bingo cards will appear here once generated.';
                 // Prepend it so it's the first child if the output area is empty
                 bingoCardsOutput.insertBefore(bingoPlaceholder, bingoCardsOutput.firstChild);
             }
             bingoPlaceholder.classList.toggle('hidden', !show);
         }


        /**
         * Resets the application state to initial values.
         */
        function resetApp() {
            songs = []; // Clear song list
            // Clear input fields
            songTitleInput.value = '';
            songArtistInput.value = '';
            bulkSongsInput.value = '';
            cardCountInput.value = '1';
            customTitleInput.value = '';
            // Clear errors and status messages
            hideInputError();
            hideListError();
            hideGenerateError();
            clearBulkStatus();
            // Reset UI elements
            displaySongList(); // Update song list display (will show 'no songs')
            bingoCardsOutput.innerHTML = ''; // Clear generated cards
            ensurePlaceholderExists(true); // Show the placeholder
            printCardsBtn.classList.add('hidden'); // Hide print button
            generateCardsBtn.disabled = true; // Disable generate button
            songTitleInput.focus(); // Focus on the first input
        }


        // --- Event Listeners ---
        addSongBtn.addEventListener('click', addSong);
        songArtistInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') addSong(); });
        songTitleInput.addEventListener('keypress', (event) => { if (event.key === 'Enter') songArtistInput.focus(); });
        addBulkBtn.addEventListener('click', addBulkSongs);
        generateCardsBtn.addEventListener('click', generateCards);
        printCardsBtn.addEventListener('click', printCards);
        resetBtn.addEventListener('click', resetApp);

        // --- Initial Setup ---
        document.addEventListener('DOMContentLoaded', () => {
            displaySongList(); // Display initial list state
            songTitleInput.focus(); // Set initial focus
            ensurePlaceholderExists(true); // Make sure placeholder is shown initially
        });

    </script>

</body>
</
